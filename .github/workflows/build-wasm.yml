name: Build WASM

on:
  push:
    branches: [upgrade-tools]
  workflow_dispatch:
    inputs:
      build_debug:
        description: 'Also build debug variant (increases build time to ~15 mins)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  check-build-flags:
    name: Check Build Flags
    runs-on: ubuntu-latest
    outputs:
      build_release: 'true'
      build_debug: ${{ steps.check_debug.outputs.build_debug }}
    steps:
      - name: Check if debug build requested
        id: check_debug
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.build_debug }}" == "true" ]]; then
            echo "build_debug=true" >> $GITHUB_OUTPUT
          else
            echo "build_debug=false" >> $GITHUB_OUTPUT
          fi

  build-wasm:
    name: Build WASM (${{ matrix.variant }})
    needs: check-build-flags
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        rust-version: ['1.91.1']
        variant: ['release', 'debug']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Skip if debug not requested
        if: matrix.variant == 'debug' && needs.check-build-flags.outputs.build_debug != 'true'
        run: |
          echo "Skipping debug build (not requested)"
          exit 0

      - name: Install Just
        uses: taiki-e/install-action@just

      - name: Install Rust ${{ matrix.rust-version }}
        run: |
          rustup toolchain install ${{ matrix.rust-version }}
          rustup target add wasm32-wasip1 --toolchain ${{ matrix.rust-version }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4.4.0
        with:
          node-version: 'lts/*'

      - name: Build ${{ matrix.variant }} Variant
        if: matrix.variant != 'debug' || needs.check-build-flags.outputs.build_debug == 'true'
        run: |
          MODE=$( [[ "${{ matrix.variant }}" == "release" ]] && echo "release" || echo "relwithdebinfo" )
          BUILDDIR=$( [[ "${{ matrix.variant }}" == "release" ]] && echo "build-release" || echo "build-debug" )
          just mode=$MODE builddir=$BUILDDIR build starling

      - name: Prepare Artifacts
        if: matrix.variant != 'debug' || needs.check-build-flags.outputs.build_debug == 'true'
        run: |
          mkdir -p wasm-artifacts
          BUILDDIR=$( [[ "${{ matrix.variant }}" == "release" ]] && echo "build-release" || echo "build-debug" )

          # Core-module versions of the runtime
          cp $BUILDDIR/starling-raw.wasm wasm-artifacts/starling-raw$( [[ "${{ matrix.variant }}" == "debug" ]] && echo "-debug" || echo "" ).wasm

          # Component-versions of the runtime
          cp $BUILDDIR/starling.wasm wasm-artifacts/starling$( [[ "${{ matrix.variant }}" == "debug" ]] && echo "-debug" || echo "" ).wasm

          # Supporting artifacts (only from release)
          if [[ "${{ matrix.variant }}" == "release" ]]; then
            cp $BUILDDIR/preview1-adapter.wasm wasm-artifacts/
          fi

          # Show original sizes
          echo "=== Original artifact sizes ==="
          ls -lh wasm-artifacts/

      - name: Create Compressed Archive
        if: matrix.variant != 'debug' || needs.check-build-flags.outputs.build_debug == 'true'
        run: |
          tar -czf starling-wasm-${{ matrix.variant }}.tar.gz -C wasm-artifacts .
          echo "=== Compressed archive size ==="
          ls -lh starling-wasm-${{ matrix.variant }}.tar.gz

      - name: Upload WASM Artifacts
        if: matrix.variant != 'debug' || needs.check-build-flags.outputs.build_debug == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: starling-wasm-${{ matrix.variant }}
          path: starling-wasm-${{ matrix.variant }}.tar.gz
          retention-days: 7
