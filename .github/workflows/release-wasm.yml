name: Release WASM

on:
  release:
    types: [published]

jobs:
  build-wasm:
    name: Build WASM (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        rust-version: ['1.91.1']
        variant: ['release']
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install Just
        uses: taiki-e/install-action@just

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Install Rust ${{ matrix.rust-version }}
        run: |
          rustup toolchain install ${{ matrix.rust-version }}
          rustup target add wasm32-wasip2 --toolchain ${{ matrix.rust-version }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4.4.0
        with:
          node-version: 'lts/*'

      - name: Build ${{ matrix.variant }} Variant
        run: |
          MODE=$( [[ "${{ matrix.variant }}" == "release" ]] && echo "release" || echo "relwithdebinfo" )
          BUILDDIR=$( [[ "${{ matrix.variant }}" == "release" ]] && echo "build-release" || echo "build-debug" )
          just mode=$MODE builddir=$BUILDDIR build starling

      - name: Prepare Artifacts
        run: |
          mkdir -p wasm-artifacts
          BUILDDIR=$( [[ "${{ matrix.variant }}" == "release" ]] && echo "build-release" || echo "build-debug" )

          # Core-module versions of the runtime
          cp $BUILDDIR/starling-raw.wasm wasm-artifacts/starling-raw$( [[ "${{ matrix.variant }}" == "debug" ]] && echo "-debug" || echo "" ).wasm

          # Component-versions of the runtime
          cp $BUILDDIR/starling.wasm wasm-artifacts/starling$( [[ "${{ matrix.variant }}" == "debug" ]] && echo "-debug" || echo "" ).wasm

          # Supporting artifacts (only from release)
          if [[ "${{ matrix.variant }}" == "release" ]]; then
            cp $BUILDDIR/preview1-adapter.wasm wasm-artifacts/
          fi

          # Show original sizes
          echo "=== Original artifact sizes ==="
          ls -lh wasm-artifacts/

      - name: Extract Version Info
        id: version_info
        run: |
          # Get StarlingMonkey version
          STARLING_VERSION=${{ github.event.release.tag_name }}
          echo "starling_version=$STARLING_VERSION" >> $GITHUB_ENV

          # Get SpiderMonkey version
          SM_TAG=$(grep "^set(SM_TAG" cmake/spidermonkey.cmake | sed 's/.*SM_TAG \([^)]*\).*/\1/')
          echo "spidermonkey_version=$SM_TAG" >> $GITHUB_ENV

          # Get Rust version
          RUST_VERSION=$(rustc --version | awk '{print $2}')
          echo "rust_version=$RUST_VERSION" >> $GITHUB_ENV

          # Get git commit
          COMMIT=$(git rev-parse --short HEAD)
          echo "commit=$COMMIT" >> $GITHUB_ENV

          # Get build timestamp
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "build_time=$BUILD_TIME" >> $GITHUB_ENV

          echo "Version Info:"
          echo "  StarlingMonkey: $STARLING_VERSION"
          echo "  SpiderMonkey: $SM_TAG"
          echo "  Rust: $RUST_VERSION"
          echo "  Commit: $COMMIT"
          echo "  Built: $BUILD_TIME"

      - name: Embed Version Metadata in WASM
        run: |
          # Use WASM file from the wasm-artifacts directory
          WASM_FILE=wasm-artifacts/starling$( [[ "${{ matrix.variant }}" == "debug" ]] && echo "-debug" || echo "" ).wasm

          # Embed version metadata into WASM binary
          wasm-tools metadata add \
            --language "rust=1.91.1" \
            --processed-by "starlingmonkey=${{ env.starling_version }}" \
            --processed-by "spidermonkey=${{ env.spidermonkey_version }}" \
            --processed-by "wasmtime=v38.0.4" \
            --sdk "wasi-sdk=28" \
            --sdk "openssl=3.0.18" \
            --revision "${{ env.commit }}" \
            --homepage "https://github.com/tonidy/StarlingMonkey" \
            --description "StarlingMonkey: A SpiderMonkey-based JavaScript runtime for Wasm" \
            --version "${{ env.starling_version }}" \
            "$WASM_FILE" -o "$WASM_FILE"

          echo "✓ Version metadata embedded in WASM binary"
          wasm-tools metadata show "$WASM_FILE"

      - name: Create Compressed Archive
        run: |
          tar -czf starling-wasm-${{ matrix.variant }}-${{ env.starling_version }}.tar.gz -C wasm-artifacts .
          echo "=== Compressed archive size ==="
          ls -lh starling-wasm-${{ matrix.variant }}-${{ env.starling_version }}.tar.gz

      - name: Upload WASM Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./starling-wasm-${{ matrix.variant }}-${{ env.starling_version }}.tar.gz
          asset_name: starling-wasm-${{ matrix.variant }}-${{ env.starling_version }}.tar.gz
          asset_content_type: application/gzip